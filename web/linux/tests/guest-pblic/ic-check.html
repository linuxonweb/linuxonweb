<!doctype html>
<meta charset="utf-8">
<title>IC check running</title>
<style>
  body { font: 18px monospace; margin: 12px; }
  #summary { font-size: 34px; font-weight: bold; }
  .fail { color: #b00; } .ok { color: #070; }
</style>
<div id="summary">running…</div>
<pre id="out"></pre>
<script>
// Guest Firefox IC compiler (PBLIC) correctness check. Each case runs its
// inputs for several rounds: the first round mostly runs before stubs are
// compiled, later rounds after. Every round must equal the expected values
// written below, and the hash must match between ?pblic=0 and ?pblic=1 boots.
"use strict";
const ROUNDS = 6, N = 600;

function show(v) {
  if (Object.is(v, -0)) return "-0";
  if (typeof v === "number" && Number.isNaN(v)) return "NaN";
  if (Array.isArray(v)) return "[" + v.map(show).join(",") + "]";
  return typeof v + ":" + String(v);
}

// Inputs cycle through edge values; f(x, y) is the hot site.
const I32 = [0, 1, -1, 2, -2, 7, -7, 2147483647, -2147483648, 65536, 46341, 3];
const NUM = [0, -0, 1.5, -1.5, NaN, Infinity, -Infinity, 1e308, 2, 4, 0.1, -3];

const cases = [];
function add(name, inputs, f, expected) { cases.push({ name, inputs, f, expected }); }
function pairs(a, b) { const r = []; for (const x of a) for (const y of b) r.push([x, y]); return r; }
function ints(a) { return a.map((x) => [x, 0]); }

// Expected results come from plain arithmetic definitions, not from the
// engine's IC paths: each uses a different formulation of the same value.
const I = pairs(I32, I32);
add("int add", I, (x, y) => x + y, ([x, y]) => Number(BigInt(x) + BigInt(y)));
add("int sub", I, (x, y) => x - y, ([x, y]) => Number(BigInt(x) - BigInt(y)));
add("int mul", I, (x, y) => x * y, ([x, y]) => {
  const p = Number(BigInt(x) * BigInt(y));
  return p === 0 && (x < 0) !== (y < 0) ? -0 : p;
});
add("int div", I, (x, y) => x / y, ([x, y]) => {
  if (y === 0) return x === 0 ? NaN : (x > 0 ? Infinity : -Infinity);
  const q = Number(x) / Number(y);
  return q;
});
add("int mod", I, (x, y) => x % y, ([x, y]) => {
  if (y === 0) return NaN;
  const r = Number(BigInt(x) % BigInt(y));
  return r === 0 && x < 0 ? -0 : r;
});
add("bit ops", I, (x, y) => [x | y, x & y, x ^ y, ~x, x << y, x >> y, x >>> y], ([x, y]) => {
  const ux = BigInt.asUintN(32, BigInt(x)), uy = BigInt.asUintN(32, BigInt(y)), s = BigInt(y & 31);
  const s32 = (v) => Number(BigInt.asIntN(32, v));
  return [s32(ux | uy), s32(ux & uy), s32(ux ^ uy), s32(~BigInt(x)), s32(ux << s),
          s32(BigInt.asIntN(32, ux) >> s), Number(ux >> s)];
});
add("int inc/dec/neg", ints(I32), (x) => { let a = x; a++; let b = x; b--; return [a, b, -x]; },
    ([x]) => [x + 1, x - 1, x === 0 ? -0 : -x]);
add("int compare", I, (x, y) => [x < y, x <= y, x > y, x >= y, x == y, x !== y],
    ([x, y]) => { const d = Number(BigInt(x) - BigInt(y)); return [d < 0, d <= 0, d > 0, d >= 0, d === 0, d !== 0]; });
add("int min/max", I, (x, y) => [Math.min(x, y), Math.max(x, y)],
    ([x, y]) => (BigInt(x) < BigInt(y) ? [x, y] : [y, x]));

const D = pairs(NUM, NUM);
add("double arith", D, (x, y) => [x + y, x - y, x * y, x / y],
    ([x, y]) => { const a = new Float64Array([x, y]); return [a[0] + a[1], a[0] - a[1], a[0] * a[1], a[0] / a[1]]; });
add("double compare", D, (x, y) => [x < y, x <= y, x > y, x >= y, x == y, x != y],
    ([x, y]) => { const u = Number.isNaN(x) || Number.isNaN(y); const c = u ? 0 : Math.sign(x - y || 0);
      return u ? [false, false, false, false, false, true]
               : (x === y ? [false, true, false, true, true, false] : [c < 0, c < 0, c > 0, c > 0, false, true]); });
add("mixed int/double", pairs(I32, NUM), (x, y) => [x + y, x * y, y - x],
    ([x, y]) => { const a = new Float64Array([x, y]); return [a[0] + a[1], a[0] * a[1], a[1] - a[0]]; });
add("math", ints(NUM.concat(I32)), (x) => [Math.abs(x), Math.floor(x), Math.ceil(x), Math.sqrt(x)],
    ([x]) => [x < 0 ? -x : (Object.is(x, -0) ? 0 : x), -Math.ceil(-x), -Math.floor(-x),
              x < 0 ? NaN : (Object.is(x, -0) ? -0 : x ** 0.5)]);
add("truthiness", ints(NUM.concat(I32, ["", "a", "0"])), (x) => (x ? 1 : 2),
    ([x]) => (Boolean(x) ? 1 : 2));
add("bool to int", pairs([true, false], I32), (x, y) => x + y, ([x, y]) => (x ? 1 : 0) + y);

// Objects: shapes, prototypes, getters, deletes, dynamic slots.
function mk(k) {
  const shapes = [
    () => ({ a: 1, b: 2 }),
    () => ({ b: 2, a: 1 }),
    () => { const o = { a: 1, b: 2, c: 3 }; delete o.c; return o; },
    () => Object.create({ a: 1, b: 2 }),
    () => ({ get a() { return 1; }, b: 2 }),
    () => { const o = {}; for (let i = 0; i < 40; i++) o["p" + i] = i; o.a = 1; o.b = 2; return o; },
    () => new (class { constructor() { this.a = 1; } get b() { return 2; } })(),
    () => Object.assign(Object.create(null), { a: 1, b: 2 }),
  ];
  return shapes[k % shapes.length]();
}
const objs = Array.from({ length: 16 }, (_, k) => [mk(k), k]);
add("property loads", objs, (o, k) => [o.a, o.b, o.c, o.p39], ([, k]) =>
  [1, 2, undefined, k % 8 === 5 ? 39 : undefined]);
add("property in/has", objs, (o) => ["a" in o, Object.hasOwn(o, "a")], ([, k]) =>
  [true, k % 8 !== 3]);

// Arrays: packed, holey, out of bounds, double index, length.
const arrs = [[1, 2, 3], [1, , 3], [1.5, "x", null], [], new Array(5), [0, -0, NaN]];
add("dense elements", pairs(arrs.map((_, i) => i), [0, 1, 2, 3, -1, 1.0, 0.5, -0]),
    (i, j) => { const a = arrs[i]; return [a[j], a.length, j in a]; },
    ([i, j]) => { const a = arrs[i]; const p = String(j === 0 ? 0 : j);
      return [Object.prototype.hasOwnProperty.call(a, p) ? Reflect.get(a, p) : undefined, a.length,
              Object.prototype.hasOwnProperty.call(a, p)]; });
const ta = new Float32Array([1.5, -2, 3e38]), tb = new Int16Array([-1, 32767, 5]);
add("typed arrays", pairs([0, 1, 2, 3], [0]), (i) => [ta[i], tb[i], ta.length],
    ([i]) => [i < 3 ? [1.5, -2, Math.fround(3e38)][i] : undefined, i < 3 ? [-1, 32767, 5][i] : undefined, 3]);

// Strings.
add("strings", ints(["", "abc", "é", "0"]), (s) => [s.length, s + "!", s ? 1 : 0, s === "abc"],
    ([s]) => [[...s].length, s.concat("!"), s === "" ? 0 : 1, s.localeCompare("abc") === 0 && s.length === 3]);

// Globals, closures, arguments, calls.
var gCounter = 0;
globalThis.gObj = { v: 5 };
function makeCounter(start) { let n = start; return (d) => (n += d); }
const counters = [makeCounter(0), makeCounter(100)];
add("closures/globals", pairs([0, 1], [1, 2, -3]), (i, d) => {
  gCounter = (gCounter + 1) | 0;
  return [typeof counters[i](d), gObj.v, gCounter > 0];
}, () => ["number", 5, true]);
function argsFn() { return arguments.length + (arguments[0] | 0) + (arguments[2] | 0); }
add("arguments", ints(I32.slice(0, 6)), (x) => [argsFn(x), argsFn(x, 1, 2), argsFn()],
    ([x]) => [1 + (x | 0), 3 + (x | 0) + 2, 0]);
// A hot function whose only throw is on a cold path runs in PBL; its throw
// must unwind into a caller that catches (possibly another tier).
function halve(x) { if (x < 0) throw new RangeError("neg " + x); return x / 2; }
add("throw paths", ints([4, 7, -1, 0, -6, 9]), (x) => {
  try { return halve(x); } catch (e) { return e instanceof RangeError ? e.message : "?"; }
}, ([x]) => (x < 0 ? "neg " + x : x * 0.5));
add("tdz", ints([0, 1]), (x) => {
  try { if (x) return tdzVal; } catch (e) { return e.constructor.name; } let tdzVal = 3; return tdzVal;
}, ([x]) => (x ? "ReferenceError" : 3));

let hash = 0x811c9dc5, fails = 0;
function mix(s) { for (let i = 0; i < s.length; i++) { hash ^= s.charCodeAt(i); hash = Math.imul(hash, 16777619) >>> 0; } }
const out = [];
for (const c of cases) {
  let bad = 0, firstBad = "";
  const t0 = performance.now();
  for (let r = 0; r < ROUNDS; r++) {
    for (let k = 0; k < N; k++) {
      const input = c.inputs[k % c.inputs.length];
      const got = show(c.f(input[0], input[1]));
      const want = show(c.expected(input));
      if (got !== want) { if (!bad) firstBad = `round ${r} input ${show(input)} got ${got} want ${want}`; bad++; }
      if (r === ROUNDS - 1 && k < c.inputs.length) mix(got);
    }
  }
  const ms = (performance.now() - t0).toFixed(0);
  if (bad) fails++;
  out.push(`${bad ? "FAIL" : "ok  "} ${c.name.padEnd(18)} ${String(ms).padStart(6)}ms ${bad ? bad + " bad; first: " + firstBad : ""}`);
}
const hex = hash.toString(16).padStart(8, "0");
document.getElementById("out").textContent = out.join("\n");
const summary = document.getElementById("summary");
summary.textContent = `${fails ? "FAIL " + fails : "ALL PASS"} (${cases.length} cases) hash ${hex}`;
summary.className = fails ? "fail" : "ok";
document.title = `IC check ${fails ? "FAIL" : "PASS"} ${hex}`;
</script>
