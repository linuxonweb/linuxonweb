<!doctype html>
<meta charset="utf-8">
<title>Text check</title>
<style>
  body { margin: 0; font: 16px sans-serif; background: #fff; color: #000; }
  #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }
  .panel { position: absolute; z-index: 1; padding: 8px 12px; }
  #plain { left: 10px; top: 10px; background: #fff; }
  #over { left: 10px; top: 120px; background: rgba(0, 0, 0, 0.35); color: #fff; }
  #sel { left: 420px; top: 120px; background: rgba(0, 0, 0, 0.35); color: #fff; }
  #small { left: 420px; top: 10px; background: #fff; font-size: 12px; }
  .red { color: #f00; }
</style>
<canvas id="gl"></canvas>
<div id="plain" class="panel">Plain text 16px on white: canvas width 1024<br>The quick brown fox 0123456789</div>
<div id="small" class="panel">Small 12px text: The quick brown fox 0123456789<br><span class="red">Red 12px 10000 500 1000</span></div>
<div id="over" class="panel">fps: 3<br>canvas width: 1024<br>canvas height: 1024<br><span class="red">10000</span><br>Over animated WebGL</div>
<div id="sel" class="panel">Selected text<br>canvas width: 1024<br>canvas height: 1024<br><span class="red">10000</span><br>Over animated WebGL</div>
<script>
// Guest text rendering check: plain, small, coloured, translucent-panel and
// selected text over an animated WebGL canvas (as on the WebGL aquarium).
const c = document.getElementById("gl");
c.width = innerWidth; c.height = innerHeight;
const gl = c.getContext("webgl2");
let t = 0;
function frame() {
  t += 0.02;
  gl.clearColor(0.1 + 0.1 * Math.sin(t), 0.3, 0.5 + 0.2 * Math.cos(t), 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  requestAnimationFrame(frame);
}
if (gl) requestAnimationFrame(frame);
const r = document.createRange();
r.selectNodeContents(document.getElementById("sel"));
getSelection().removeAllRanges();
getSelection().addRange(r);
document.title = "Text check ready";
</script>
