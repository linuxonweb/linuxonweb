<!doctype html><meta charset="utf-8"><title>GPU protocol and real pixel tests</title><pre id="output"></pre>
<script type="module">
import {MAGIC, VERSION, OP, decodeHeader, serveGPU} from './host.mjs';
const result=window.guestGPUHostTests={checks:[],errors:[],adapter:null};
const check=(ok,label)=>{if(!ok)throw Error(label);result.checks.push(label);};
function pipe() {
  let queue=[], waiters=[], closed=false;
  return {
    put(bytes){if(closed)return;queue.push(...bytes);waiters.splice(0).forEach(fn=>fn());},
    async readExactly(n){while(queue.length<n&&!closed)await new Promise(resolve=>waiters.push(resolve));return Uint8Array.from(queue.splice(0,n));},
    close(){closed=true;waiters.splice(0).forEach(fn=>fn());}
  };
}
function harness(options={}) {
  const incoming=pipe(),outgoing=pipe();let sequence=0;
  const serving=serveGPU({readExactly:n=>incoming.readExactly(n),write:async bytes=>outgoing.put(bytes),close(){incoming.close();outgoing.close();}},options);
  return {serving, async call(op,payload=new Uint8Array()) {
    const header=new Uint8Array(16),v=new DataView(header.buffer);v.setUint32(0,MAGIC,true);v.setUint16(4,VERSION,true);v.setUint16(6,op,true);v.setUint32(8,++sequence,true);v.setUint32(12,payload.byteLength,true);
    // Deliberately fragment every wire header/body to exercise stream assembly.
    incoming.put(header.subarray(0,5));incoming.put(header.subarray(5));incoming.put(payload.subarray(0,3));incoming.put(payload.subarray(3));
    const response=await outgoing.readExactly(16);if(response.length!==16)throw Error('connection ended');
    const rv=new DataView(response.buffer),body=await outgoing.readExactly(rv.getUint32(12,true));
    check(rv.getUint32(8,true)===sequence,'reply sequence '+sequence);
    return {status:new DataView(body.buffer).getInt32(0,true),body:body.subarray(4)};
  }};
}
const u32=(...values)=>{const b=new Uint8Array(values.length*4),v=new DataView(b.buffer);values.forEach((n,i)=>v.setUint32(i*4,n,true));return b;};
try {
  for(const [label,patch] of [['version',v=>v.setUint16(4,2,true)],['oversize',v=>v.setUint32(12,1048577,true)],['opcode',v=>v.setUint16(6,99,true)]]) {
    const b=new Uint8Array(16),v=new DataView(b.buffer);v.setUint32(0,MAGIC,true);v.setUint16(4,1,true);v.setUint32(8,1,true);patch(v);
    let rejected=false;try{decodeHeader(b);}catch{rejected=true;}check(rejected,'reject '+label);
  }
  const unavailable=await serveGPU({close(){},readExactly(){throw Error('unexpected read');}},{gpu:null});check(unavailable.error.includes('unavailable'),'unavailable API explicit');
  const h=harness();const hello=await h.call(OP.HELLO);check(hello.status===0,'real WebGPU device');result.adapter=JSON.parse(new TextDecoder().decode(hello.body)).adapter;
  check((await h.call(OP.TARGET,u32(513,1))).status===-22,'oversize texture rejected');
  const shader=new TextEncoder().encode('struct O{@builtin(position)p:vec4f,@location(0)c:vec3f}; @vertex fn vs(@location(0)p:vec2f,@location(1)c:vec3f)->O{return O(vec4f(p,0,1),c);} @fragment fn fs(o:O)->@location(0)vec4f{return vec4f(o.c,1);}');
  const create=async(op,data)=>{const r=await h.call(op,data);check(r.status===0,'create '+op);return new DataView(r.body.buffer,r.body.byteOffset,4).getUint32(0,true);};
  const module=await create(OP.SHADER,shader),buffer=await create(OP.BUFFER,new Uint8Array(new Float32Array([-.8,-.8,1,0,0,.8,-.8,0,1,0,0,.8,0,0,1]).buffer));
  const pipeline=await create(OP.PIPELINE,u32(module)),target=await create(OP.TARGET,u32(128,128));
  check((await h.call(OP.DRAW,u32(target,pipeline,buffer,6))).status===-22,'vertex overrun rejected');
  check((await h.call(OP.DRAW,u32(target,pipeline,buffer,3))).status===0,'actual GPU draw');
  const read=await h.call(OP.READBACK,u32(target));check(read.status===0&&read.body.length===65536,'packed actual readback');
  const p=read.body.slice((64*128+64)*4,(64*128+64)*4+4);
  check(p[0]>20&&p[1]>20&&p[2]>40&&p[3]===255,'triangle center has interpolated RGB');check(read.body.slice(0,4).join(',')==='0,0,0,255','clear corner exact');
  for(const id of [target,pipeline,buffer,module])check((await h.call(OP.DESTROY,u32(id))).status===0,'destroy '+id);
  check((await h.call(OP.DESTROY,u32(target))).status===-22,'stale handle rejected');await h.call(OP.CLOSE);
  const finished=await h.serving;check(!finished.error&&finished.released===4,'session cleanup counted');
  // CLEAR is opt-in: an unchanged guest-gpu session cannot accidentally accept it.
  const legacy=harness();const legacyHello=await legacy.call(OP.HELLO);
  check(!JSON.parse(new TextDecoder().decode(legacyHello.body)).clearImage,'legacy HELLO has no clear capability');
  let legacyRejected=false;try{await legacy.call(OP.CLEAR,u32(1,0,0,0,0));}catch{legacyRejected=true;}
  check(legacyRejected&&(await legacy.serving).error.includes('invalid opcode'),'legacy clear rejected and session closed');
  const clear=harness({allowClear:true});const clearHello=await clear.call(OP.HELLO);
  check(JSON.parse(new TextDecoder().decode(clearHello.body)).clearImage===true,'explicit clear capability');
  const targetReply=await clear.call(OP.TARGET,u32(17,3));check(targetReply.status===0,'create padded-row clear target');
  const clearTarget=new DataView(targetReply.body.buffer,targetReply.body.byteOffset,4).getUint32(0,true);
  const color=(id,rgba)=>{const b=new Uint8Array(20),v=new DataView(b.buffer);v.setUint32(0,id,true);rgba.forEach((n,i)=>v.setFloat32(4+4*i,n,true));return b;};
  check((await clear.call(OP.CLEAR,u32(clearTarget))).status===-22,'short clear rejected');
  check((await clear.call(OP.CLEAR,color(clearTarget,[NaN,0,0,1]))).status===-22,'nonfinite clear rejected');
  check((await clear.call(OP.CLEAR,color(clearTarget,[2,0,0,1]))).status===-22,'out-of-profile clear rejected');
  check((await clear.call(OP.CLEAR,color(0,[1,0,0,1]))).status===-22,'unknown target rejected');
  const wrong=await clear.call(OP.BUFFER,new Uint8Array(20));check(wrong.status===0,'create wrong-type resource');
  const wrongId=new DataView(wrong.body.buffer,wrong.body.byteOffset,4).getUint32(0,true);
  check((await clear.call(OP.CLEAR,color(wrongId,[1,0,0,1]))).status===-22,'wrong resource type rejected');
  for(const rgba of [[1,0,0,1],[0,1,0,0]]) {
    check((await clear.call(OP.CLEAR,color(clearTarget,rgba))).status===0,'real WebGPU clear');
    const pixels=await clear.call(OP.READBACK,u32(clearTarget));
    check(pixels.status===0&&pixels.body.length===204&&pixels.body.every((n,i)=>n===rgba[i%4]*255),'all 51 padded-row pixels exact '+rgba.join(','));
  }
  await clear.call(OP.DESTROY,u32(wrongId));await clear.call(OP.DESTROY,u32(clearTarget));
  check((await clear.call(OP.CLEAR,color(clearTarget,[1,0,0,1]))).status===-22,'stale clear target rejected');
  await clear.call(OP.CLOSE);const clearDone=await clear.serving;
  check(!clearDone.error&&clearDone.clears===2&&clearDone.readbacks===2&&clearDone.released===2,'clear/readback cleanup exact');
  let testDevice;
  const loss=harness({gpu:{async requestAdapter(){const adapter=await navigator.gpu.requestAdapter();return {info:adapter.info,async requestDevice(){testDevice=await adapter.requestDevice();return testDevice;}};}}});
  await loss.call(OP.HELLO);check((await loss.call(OP.TARGET,u32(17,3))).status===0,'live resource before device loss');testDevice.destroy();const lost=await loss.serving;check(lost.error?.startsWith('device lost:')&&lost.released===1,'device loss closes pending read and releases resource');
  document.documentElement.dataset.result='pass';
} catch(error){result.errors.push(error.stack);document.documentElement.dataset.result='fail';}
document.querySelector('#output').textContent=JSON.stringify(result,null,2);
</script>
