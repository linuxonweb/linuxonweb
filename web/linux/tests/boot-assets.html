<!doctype html><meta charset="utf-8"><title>Boot asset transactions</title><pre id="result">Running…</pre>
<script type="module">

  unavailable = ''; corrupt = next.assets.firefox.sha256;
  try { await store.updateSystem(); throw new Error('expected integrity failure'); } catch (error) { assert(error.message.includes('verify'), 'corrupt final image rejected'); }

  try { await store.updateSystem(); throw new Error('expected partial chunk failure'); } catch (error) { assert(error.name === 'QuotaExceededError', `mid-image chunk failure reported (${error.name}: ${error.message})`); }

  const parent = document.createElement('main'); document.body.append(parent);

    usage: async () => ({ home: { bytes: 0, files: 1 }, system: { bytes: 0, version: 'test' }, estimate: { usage: 0, quota: 100 } }),
    update: async () => { if (fail) throw new Error('update failed'); },
    restart: async () => { restarts++; }, deleteHome: async () => { deletes++; },
    clearCache: async () => {}, persist: async () => true, rollback: async () => {},

  click('cancel-delete'); assert(deletes === 0, 'cancelled home deletion preserves data');
