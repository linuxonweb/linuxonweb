<!doctype html><meta charset="utf-8"><title>Experimental guest Vulkan command profile</title>
<h1>Guest Vulkan lifecycle and clear/readback test</h1>
<p>Isolated lifecycle and opt-in offscreen clear/readback profile. This partial compute queue does not implement dispatch or Vulkan conformance. No OpenGL, Firefox acceleration, decoder or physical GPU claim.</p>
<button id="boot">Run isolated guest</button><button id="stop">Stop guest</button>
<canvas id="display" width="640" height="480"></canvas><pre id="log"></pre>
<script type="module">
import {spawnMachine, consoleDevice, entropyDevice, inputDevice, vsockDevice} from '../../dist/index.js';
import {serveLifecycle} from './host.mjs';
const report = window.guestVulkanResults = {logs:'', errors:[], events:[], host:null, hellos:[], pass:false,
  bootLogs:'', bootConfigurationEvidence:[], isolated:crossOriginIsolated};
const decoder = new TextDecoder(), vsock = vsockDevice();
let machine, deadline, partial = '', connected = false, finished = false, stopping = false;
function fail(error) {
  if (stopping) return;
  report.errors.push(String(error)); finished = true; clearTimeout(deadline);
  document.documentElement.dataset.result = 'fail';
}
function check() {
  if (finished || !report.host || !/^GUEST_VK_EXIT status=0 checks=\d+$/m.test(report.logs.replaceAll('\r',''))) return;
  const h = report.host, own = h.ownership;
  const base = report.errors.length === 0 && h.draws === 0 && own.connectionsClosed === 1 &&
    own.liveDevices === 0 && own.liveTextures === 0 && own.liveBuffers === 0;
  if (report.mode === 'unavailable') {
    report.pass = base && h.readbacks === 0 && h.released === 0 && h.commands === 0 && !h.adapter && own.devicesCreated === 0 && own.devicesDestroyed === 0 &&
      h.error === 'WebGPU unavailable: no renderer fallback is implied' && report.hellos.length === 0 &&
      report.logs.includes('GUEST_VK_UNAVAILABLE_PASS') && !report.logs.includes('GUEST_VK_DEVICE_PASS');
  } else {
    const matchingHello = report.hellos.length === 2 && report.hellos.every(item => item.version === 1 &&
      item.shader === 'WGSL' && JSON.stringify(item.adapter) === JSON.stringify(h.adapter));
    const loss = report.mode.startsWith('loss-');
    const clear = report.mode === 'clear' || report.mode === 'exhaustion';
    const operations = report.events.filter(e => e.type === 'command').map(e => `${e.opcode}:${e.status}`).join(',');
    const rendering = clear ? h.clears === 2 && h.readbacks === 2 && h.released === 1 && report.hellos.every(x => x.clearImage === true) &&
      report.logs.includes('GUEST_VK_CLEAR_PASS colors=2 pixels=102 tight_rows=68 host_rows=256') &&
      report.logs.includes('GUEST_VK_RESOURCES live=0') && operations === '0:0,0:0,4:0,9:0,6:0,9:0,6:0,7:0,8:0' :
      h.clears === 0 && h.readbacks === 0 && h.released === 0 && operations === '0:0,0:0,8:0';
    if(loss) {
      const deviceLoss=report.mode === 'loss-device';
      const fault=h.fault;
      report.pass=base && matchingHello && report.hellos.every(x => x.clearImage === true) &&
        h.clears === 1 && h.readbacks === 0 && h.released === 1 && !!h.adapter &&
        own.devicesCreated === 1 && own.devicesDestroyed === 1 && own.texturesCreated === 1 && own.texturesDestroyed === 1 &&
        own.buffersCreated === (deviceLoss?1:0) && own.buffersDestroyed === (deviceLoss?1:0) &&
        fault.injected && fault.clearCompleted === 1 && fault.readbackRequests === 1 &&
        fault.nativeDeviceLost === deviceLoss && fault.readbackMapStarted === deviceLoss &&
        (deviceLoss ? h.error?.startsWith('device lost:') : h.error === 'fixture transport loss after completed clear') &&
        operations === '0:0,0:0,4:0,9:0' && h.commands === 4 &&
        report.events.filter(e => e.type === 'fault').length === 1 &&
        report.logs.includes('GUEST_VK_LOSS_PASS submit=-4 queue_idle=-4 device_idle=-4 resubmit=-4 fresh_submit=-4 unchanged_bytes=212') &&
        report.logs.includes('GUEST_VK_RESOURCES live=0 allocated_bytes=0') &&
        report.logs.includes('GUEST_VK_LIFETIME_PASS live_instances=0 live_devices=0') &&
        report.logs.includes('GUEST_VK_CLOSE status=-1');
    } else report.pass = base && rendering && h.commands === (clear ? 9 : 3) && h.error === null && !!h.adapter && matchingHello &&
      own.devicesCreated === 1 && own.devicesDestroyed === 1 &&
      report.logs.includes('GUEST_VK_DEVICE_PASS') && report.logs.includes('GUEST_VK_LIFETIME_PASS live_instances=0 live_devices=0') &&
      report.logs.includes('GUEST_VK_CLOSE status=0') &&
      (report.mode !== 'exhaustion' || report.logs.includes('GUEST_VK_EXHAUSTION_PASS heap_bytes=1048576 table_entries=32 rejected=6 recovery=2 live=0 allocated_bytes=0'));
  }
  if (!report.pass) { fail('lifecycle acceptance mismatch'); return; }
  report.hostLifetimePass = true; finished = true; clearTimeout(deadline);
  document.documentElement.dataset.result = 'pass';
}
const log = bytes => {
  const text = decoder.decode(new Uint8Array(bytes), {stream:true});
  report.logs = (report.logs + text).slice(-131072);
  partial += text;
  const lines = partial.split('\n'); partial = lines.pop().slice(-8192);
  for (const raw of lines) {
    const line = raw.replaceAll('\r','');
    if (line.startsWith('GUEST_VK_HOST_HELLO ')) {
      try { report.hellos.push(JSON.parse(line.slice('GUEST_VK_HOST_HELLO '.length))); }
      catch (error) { fail(`invalid guest HELLO JSON: ${error}`); }
    }
    if (line.includes('GUEST_VK_FAIL') || /^GUEST_VK_EXIT status=[1-9]/.test(line)) fail(line);
  }
  document.querySelector('#log').textContent = report.logs.slice(-20000);
  if (!connected && report.logs.includes('GUEST_GPU_LISTENING')) {
    connected = true;
    vsock.connect(4050, {timeoutMs:10000})
      .then(connection => serveLifecycle(connection, report.mode, event => { if (report.events.length < 64) report.events.push(event); }))
      .then(host => { report.host = host; check(); }).catch(fail);
  }
  check();
};
async function captureBoot(stream) {
  const reader = stream.getReader(), decoder = new TextDecoder(); let pending = '';
  try {
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      const text = decoder.decode(new Uint8Array(value), {stream:true}); report.bootLogs = (report.bootLogs + text).slice(-131072);
      const lines = (pending + text).split('\n'); pending = lines.pop().slice(-8192);
      for (const line of lines) if (/Memory:|smp: Brought up/.test(line) && report.bootConfigurationEvidence.length < 16)
        report.bootConfigurationEvidence.push(line.replaceAll('\r',''));
    }
  } catch (error) { if (!stopping) report.bootConsoleError = String(error); }
  finally { reader.releaseLock(); }
}
const sha256 = async bytes => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(n => n.toString(16).padStart(2,'0')).join('');
document.querySelector('#boot').onclick = async () => {
  document.querySelector('#boot').disabled = true;
  deadline = setTimeout(() => { fail('page watchdog: 120 seconds'); machine?.close(); }, 120000);
  try {
    if (!crossOriginIsolated) throw Error('cross-origin isolation required');
    const candidate = new URLSearchParams(location.search).get('candidate') || 'candidate';
    if (!/^candidate(?:-unavailable|-clear|-loss-transport|-loss-device|-exhaustion)?$/.test(candidate)) throw Error('invalid isolated candidate');
    const metadataResponse = await fetch(`./${candidate}/package.json`);
    if (!metadataResponse.ok) throw Error('candidate metadata unavailable');
    const metadata = await metadataResponse.json();
    if (!metadata.testOnly || !metadata.passPackage || !['live','unavailable','clear','loss-transport','loss-device','exhaustion'].includes(metadata.mode)) throw Error('invalid test package');
    report.mode = metadata.mode; report.package = metadata;
    for (const [relative, hash] of Object.entries(metadata.guestBinary.hostSources)) {
      const response = await fetch(new URL(relative, new URL('../', location.href)));
      if (!response.ok || await sha256(await response.arrayBuffer()) !== hash) throw Error('host source changed: ' + relative);
    }
    const response = await fetch(`./${candidate}/initramfs.cpio`);
    if (!response.ok) throw Error('candidate archive unavailable');
    const initcpio = new Uint8Array(await response.arrayBuffer());
    if (initcpio.length !== metadata.bytes || await sha256(initcpio) !== metadata.archiveSha256) throw Error('candidate hash mismatch');
    report.configuration = {cpus:2, memoryBytes:1073741824, visibility:document.visibilityState};
    machine = await spawnMachine({cpus:2, devicetree:{memory:{reg:[0,report.configuration.memoryBytes]}}, initcpio,
      cmdline:'console=hvc0 rdinit=/init', devices:[consoleDevice(null,new WritableStream({write:log})), entropyDevice(), inputDevice(), vsock],
      framebuffer:{canvas:document.querySelector('#display'), width:640, height:480, backend:'canvas2d'}});
    window.guestVulkanMachine = machine; void captureBoot(machine.bootConsole);
    machine.closed.catch(error => { if (!finished) fail(error); });
  } catch (error) { fail(error); }
};
document.querySelector('#stop').onclick = () => { stopping = true; clearTimeout(deadline); machine?.close(); };
</script>
