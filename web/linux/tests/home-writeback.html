<!doctype html><meta charset="utf-8"><title>Experimental real guest writeback assessment</title><canvas id="display" width="640" height="480"></canvas><pre id="result">Running…</pre>

const idb=req=>new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

async function inspect(store,name){const node=await store.lookup(store.root,name);if(!node)return {exists:false};const data=await store.read(node,{},0n,2*1048576);return {exists:true,size:data.length,sha256:hex(await crypto.subtle.digest('SHA-256',data)),allA:data.every(x=>x===0x61),byte100:data[100],byte101:data[101],byte102:data[102],truncateTailZero:data.subarray(17).every(x=>x===0)};}
try{
 const meta=await(await fetch('./home-mount.json')).json(),image=new Uint8Array(await(await fetch('./home-mount.cpio')).arrayBuffer());assert(hex(await crypto.subtle.digest('SHA-256',image))===meta.archiveSha256,'test image SHA matches');result.fixture=meta;

 void(async()=>{const r=machine.bootConsole.getReader();try{while(!(await r.read()).done){}}finally{r.releaseLock();}})();
 const done=await Promise.race([guestDone,new Promise((_,reject)=>setTimeout(()=>reject(Error('writeback assessment60s deadline')),60000)),machine.closed.then(()=>{throw Error('guest stopped early');})]);result.nativePassed=/failures=0$/.test(done);
 result.beforeStop={};for(const name of ['bench','read-for-write','truncate','renamed','fault-quota','fault-abort','sync-open','close-only','stop-open'])result.beforeStop[name]=await inspect(observer,name);

 observer=await openPersistentHome({name:db,readOnly:true});result.afterStop={};for(const name of Object.keys(result.beforeStop))result.afterStop[name]=await inspect(observer,name);
 const rows=result.afterStop;assert(rows.bench.size===1048576&&rows.bench.allA,'explicit fsync retains full benchmark data');assert(rows['read-for-write'].size===4096&&rows['read-for-write'].byte100===0x61&&rows['read-for-write'].byte101===90&&rows['read-for-write'].byte102===0x61,'O_WRONLY read-for-write preserved adjacent bytes');assert(rows.truncate.size===4096&&rows.truncate.truncateTailZero,'dirty truncate and extension remain zero-filled');assert(rows.renamed.size===4096&&rows.renamed.allA,'fsynced atomic rename persists');assert(rows['sync-open'].size===4096&&rows['sync-open'].allA,'syncfs makes an open file durable');
 result.currentStopDurabilityPass=rows['close-only'].size===4096&&rows['close-only'].allA&&rows['stop-open'].size===4096&&rows['stop-open'].allA;
 result.writebackNegotiated=result.counts.byFile.bench.writes<256;assert(result.writebackNegotiated,'Linux coalesced256applicationwrites into fewer host requests');

}catch(error){result.errors.push(String(error));result.pass=false;}
finally{IDBObjectStore.prototype.put=put;if(machine){machine.close();await machine.closed.catch(()=>{});}await observer?.destroy().catch(()=>{});await home?.destroy().catch(()=>{});await idb(indexedDB.deleteDatabase(db)).catch(()=>{});result.finished=new Date().toISOString();document.querySelector('#result').textContent=JSON.stringify(result,null,2);document.documentElement.dataset.result=result.pass?'pass':'fail';}
