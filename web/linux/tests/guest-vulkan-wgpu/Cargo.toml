[package]
name = "guest-vulkan-wgpu-host"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
[profile.release]
opt-level = 2
strip = "debuginfo"
