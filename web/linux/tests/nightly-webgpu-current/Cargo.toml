wgt = { package = "wgpu-types", path = "/mnt/p6/build/firefox-nightly-musl-recovery-20261002/source/firefox-159.0a1/third_party/rust/wgpu-types", features = ["serde"] }
hashbrown = { version = "0.17", features = ["serde"] }
[profile.release]
