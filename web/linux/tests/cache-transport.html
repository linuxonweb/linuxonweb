<!doctype html><meta charset="utf-8"><title>Cache transport diagnostic</title><pre id="result">Measuring…</pre>
<script type="module">
const cacheName = 'linuxonweb.cache-transport-probe.' + Date.now();
const rows = [], storage = await caches.open(cacheName);
const sha = async data => [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))].map(byte => byte.toString(16).padStart(2, '0')).join('');
try {
  for (const size of [65536, 262144, 1048576, 4194304]) {
    const bytes = new Uint8Array(size);
    for (let i = 0; i < size; i++) bytes[i] = (i * 31 + (i >> 8)) & 255;
    const expected = await sha(bytes);
    for (const kind of ['arraybuffer', 'blob', 'stream']) {
      for (const lengthHeader of [true, false]) {
        const key = new URL(`./cache-transport-${size}-${kind}-${lengthHeader}`, location.href).href;
        const start = performance.now(), row = { size, kind, lengthHeader };
        try {
          let body;
          if (kind === 'arraybuffer') body = bytes.buffer;
          else if (kind === 'blob') body = new Blob([bytes], { type: 'application/octet-stream' });
          else {
            let offset = 0;
            body = new ReadableStream({ pull(controller) {
              if (offset === bytes.length) { controller.close(); return; }
              const end = Math.min(bytes.length, offset + 65536);
              controller.enqueue(bytes.subarray(offset, end)); offset = end;
            } });
          }
          const headers = { 'Content-Type': 'application/octet-stream' };
          if (lengthHeader) headers['Content-Length'] = String(size);
          await storage.put(key, new Response(body, { headers }));
          const saved = await storage.match(key);
          const actual = await saved.arrayBuffer();
          row.ok = actual.byteLength === size && await sha(actual) === expected;
          row.bytes = actual.byteLength;
        } catch (error) { row.ok = false; row.error = `${error.name}: ${error.message}`; }
        row.ms = Math.round(performance.now() - start);
        rows.push(row);
        await storage.delete(key);
        document.querySelector('#result').textContent = JSON.stringify({ status: 'measuring', rows }, null, 2);
      }
    }
  }
  document.querySelector('#result').textContent = JSON.stringify({ status: 'complete', rows, estimate: await navigator.storage.estimate() }, null, 2);
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  document.querySelector('#result').textContent = JSON.stringify({ status: 'failed', error: error.stack, rows }, null, 2);
  document.documentElement.dataset.result = 'fail';
} finally { await caches.delete(cacheName); }
</script>
