<!doctype html><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E"><title>Isolated pipeline-state candidate</title>
<button id="boot">Run candidate Vulkan pixel fixture</button><button id="stop">Stop</button>
<canvas id="display" width="640" height="480"></canvas><pre id="log"></pre>
<script type="module">
import {spawnMachine,consoleDevice,entropyDevice,inputDevice} from '../../dist/index.js';
const params=new URLSearchParams(location.search),backend=params.get('backend')||'webgpu';
const report=window.guestPipelineResults={isolated:crossOriginIsolated,logs:'',bootLogs:'',bootConfigurationEvidence:[],errors:[],done:false,pass:false,backend,candidateOnly:true,scope:'new pipeline-state primitive; no Firefox acceptance'};
let machine,deadline,stopped=false,partial='';const decoder=new TextDecoder();
const finish=pass=>{if(report.done)return;report.done=true;report.pass=pass;clearTimeout(deadline);document.documentElement.dataset.result=pass?'pass':'fail';};
const fail=error=>{report.errors.push(String(error));finish(false);};
function log(bytes){const text=decoder.decode(new Uint8Array(bytes),{stream:true});report.logs=(report.logs+text).slice(-1048576);const lines=(partial+text).split('\n');partial=lines.pop().slice(-8192);for(const raw of lines){const line=raw.replaceAll('\r','');const exit=/^GUEST_VK_PIPELINE_EXIT status=(\d+)/.exec(line);if(exit){report.exitStatus=Number(exit[1]);finish(report.exitStatus===0);}if(/^GUEST_VK_PIPELINE_.*FAIL/.test(line))report.errors.push(line);}document.querySelector('#log').textContent=report.logs.slice(-24000);}
async function bootConsole(stream){const reader=stream.getReader(),decoder=new TextDecoder();let pending='';try{for(;;){const{value,done}=await reader.read();if(done)break;const text=decoder.decode(new Uint8Array(value),{stream:true});report.bootLogs=(report.bootLogs+text).slice(-131072);const lines=(pending+text).split('\n');pending=lines.pop().slice(-8192);for(const line of lines)if(/Memory:|smp: Brought up/.test(line))report.bootConfigurationEvidence.push(line.replaceAll('\r',''));}}catch(e){if(!stopped)report.bootConsoleError=String(e);}finally{reader.releaseLock();}}
const digest=async bytes=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');
document.querySelector('#boot').onclick=async()=>{document.querySelector('#boot').disabled=true;deadline=setTimeout(()=>{fail('finite guest deadline');machine?.close();},480000);try{
 if(!crossOriginIsolated||!['webgpu','webgl','auto'].includes(backend))throw Error('isolated explicit Rust backend required');
 const metadata=await(await fetch('./candidate/package.json',{cache:'no-store'})).json(),archive=new Uint8Array(await(await fetch('./candidate/initramfs.cpio',{cache:'no-store'})).arrayBuffer());
 if(!metadata.passPackage||!metadata.testOnly||metadata.bytes!==archive.length||metadata.archiveSha256!==await digest(archive)||metadata.candidateRuntime.pipelineStateProfile!==1)throw Error('candidate package identity mismatch');
 report.package=metadata;const cpus=navigator.hardwareConcurrency;if(!Number.isInteger(cpus)||cpus<1||cpus>64)throw Error('exact browser CPU allocation unavailable');
 report.configuration={cpus,memoryBytes:1073741824,cmdline:'console=hvc0 rdinit=/init',gpuHostcall:{stallMs:30000,ownerConfig:{vk:{backend:'wgpu',wgpuBackend:backend,forceFallbackAdapter:false,allowResources:true}}},visibility:document.visibilityState};
 machine=await spawnMachine({cpus,devicetree:{memory:{reg:[0,report.configuration.memoryBytes]}},initcpio:archive,cmdline:report.configuration.cmdline,devices:[consoleDevice(null,new WritableStream({write:log})),entropyDevice(),inputDevice()],framebuffer:{canvas:document.querySelector('#display'),width:640,height:480,backend:'canvas2d'},gpuHostcall:report.configuration.gpuHostcall});
 window.guestPipelineMachine=machine;report.gpuEvents=machine.gpuHostcall?.events??[];void bootConsole(machine.bootConsole);machine.closed.catch(e=>{if(!report.done&&!stopped)fail(e);});
}catch(e){fail(e);}};
document.querySelector('#stop').onclick=()=>{stopped=true;clearTimeout(deadline);machine?.close();report.stopped=true;};
</script>
