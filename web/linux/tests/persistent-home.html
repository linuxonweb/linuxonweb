<!doctype html><meta charset="utf-8"><title>Persistent home regression</title><pre id="result">Running…</pre>
<script type="module">
import { openPersistentHome, acquireHomeLock, CHUNK_SIZE, BLOCK_SIZE } from '../persistent-home.mjs';
const result = document.querySelector('#result');
const passed = [];
const assert = (condition, label) => { if (!condition) throw new Error(label); passed.push(label); };
const encoder = new TextEncoder(), decoder = new TextDecoder();
const context = { mode: 0o700, uid: 1000, gid: 1000 };
const dbName = 'linuxonweb.home.test.' + Date.now(), legacyName = dbName + '.legacy';
const idb = req => new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
let home;
try {
  home = await openPersistentHome({ name: dbName });
  const directory = await home.mkdir(home.root, 'admin', context);
  // A create must own its open handle before a queued unlink can remove it.
  const creating = home.create(directory, 'create-unlink', 2 | 0x200, context);
  const unlinking = home.unlink(directory, 'create-unlink');
  const [raced] = await Promise.all([creating, unlinking]);
  assert((await home.getattr(raced.node)).size === 0n, 'new O_TRUNC file starts empty even when unlinked concurrently');
  await home.write(raced.node, raced.handle, 0n, encoder.encode('open through unlink'));
  assert(decoder.decode(await home.read(raced.node, raced.handle, 0n, 64)) === 'open through unlink', 'concurrent create/unlink retains a usable open inode');
  await home.release(raced.node, raced.handle);
  try { await home.getattr(raced.node); throw new Error('released orphan survived'); }
  catch (error) { assert(error.errno === 2, 'last close removes the concurrently unlinked inode'); }
  const { node, handle } = await home.create(directory, 'original', 2, { ...context, mode: 0o600 });
  await home.write(node, handle, BigInt(CHUNK_SIZE - 2), encoder.encode('abcdef'));
  assert(decoder.decode(await home.read(node, handle, BigInt(CHUNK_SIZE - 2), 6)) === 'abcdef', 'write spans chunk boundary');
  assert((await home.read(node, handle, 0n, 32)).every(byte => byte === 0), 'sparse gap is zero-filled');
  await home.setattr(node, { size: BigInt(CHUNK_SIZE) });
  await home.setattr(node, { size: BigInt(CHUNK_SIZE + 4) });
  assert(decoder.decode(await home.read(node, handle, BigInt(CHUNK_SIZE - 2), 6)) === 'ab\0\0\0\0', 'truncate then extend never exposes old bytes');
  await home.setattr(node, { size: 0n });
  await home.write(node, handle, 0n, encoder.encode('saved after reload'));
  await home.fsync(node, handle);
  await home.rename(directory, 'original', directory, 'renamed');
  const link = await home.symlink(directory, 'link', 'renamed', context);
  assert(await home.readlink(link) === 'renamed', 'symlink target round trips');
  await home.release(node, handle);
  await home.destroy();
  home = await openPersistentHome({ name: dbName });
  const admin = await home.lookup(home.root, 'admin');
  const saved = await home.lookup(admin, 'renamed');
  assert(decoder.decode(await home.read(saved, {}, 0n, 100)) === 'saved after reload', 'close and reopen preserves renamed bytes');
  assert((await home.getattr(saved)).uid === 1000 && (await home.getattr(saved)).mode === 0o100600, 'ownership and mode persist');
  const opened = await home.open(saved, 2);
  await home.unlink(admin, 'renamed');
  assert(await home.lookup(admin, 'renamed') === undefined, 'unlink removes the directory entry');
  assert(decoder.decode(await home.read(saved, opened, 0n, 100)) === 'saved after reload', 'open unlinked inode remains readable');
  const observer = await openPersistentHome({ name: dbName, readOnly: true });
  try {
    assert(decoder.decode(await home.read(saved, opened, 0n, 100)) === 'saved after reload', 'observer opening preserves another connection\'s open unlinked inode');
    const observedHandle = await observer.open(saved, 0);
    assert(decoder.decode(await observer.read(saved, observedHandle, 0n, 100)) === 'saved after reload', 'observer reads the actual committed unlinked bytes');
    await observer.release(saved, observedHandle);
    assert(decoder.decode(await home.read(saved, opened, 0n, 100)) === 'saved after reload', 'observer release preserves the guest\'s open inode');
    try { await observer.write(saved, {}, 0n, encoder.encode('changed')); throw new Error('expected EROFS'); } catch (error) { assert(error.errno === 30, 'observer rejects writes'); }
    try { await observer.open(saved, 2); throw new Error('expected EROFS'); } catch (error) { assert(error.errno === 30, 'observer rejects writable handles'); }
    try { await observer.create(admin, 'observer-file', 2, context); throw new Error('expected EROFS'); } catch (error) { assert(error.errno === 30, 'observer rejects file creation'); }
  } finally { await observer.destroy(); }
  assert(decoder.decode(await home.read(saved, opened, 0n, 100)) === 'saved after reload', 'observer close preserves guest bytes');
  await home.release(saved, opened);
  try { await home.getattr(saved); throw new Error('expected ENOENT'); } catch (error) { assert(error.errno === 2, 'final close reclaims unlinked inode'); }
  const source = await home.create(admin, 'source', 2, context), target = await home.create(admin, 'target', 2, context);
  await home.write(source.node, source.handle, 0n, encoder.encode('new'));
  await home.write(target.node, target.handle, 0n, encoder.encode('old'));
  await home.rename(admin, 'source', admin, 'target');
  assert(decoder.decode(await home.read(target.node, target.handle, 0n, 9)) === 'old', 'rename retains overwritten open inode');
  assert(decoder.decode(await home.read(await home.lookup(admin, 'target'), {}, 0n, 9)) === 'new', 'atomic rename exposes replacement');
  await home.release(target.node, target.handle);
  const put = IDBObjectStore.prototype.put;
  let puts = 0;
  IDBObjectStore.prototype.put = function (...args) {
    if (this.name === 'chunks' && ++puts === 2) throw new DOMException('Injected quota exhaustion', 'QuotaExceededError');
    return put.apply(this, args);
  };
  try {
    await home.write(source.node, source.handle, 0n, new Uint8Array(CHUNK_SIZE * 2).fill(7));
    throw new Error('expected ENOSPC');
  } catch (error) { assert(error.errno === 28, 'quota exhaustion maps to guest ENOSPC'); }
  finally { IDBObjectStore.prototype.put = put; }
  assert(decoder.decode(await home.read(source.node, source.handle, 0n, 9)) === 'new', 'failed multi-chunk write rolls back bytes and size');
  await home.write(source.node, source.handle, 3n, encoder.encode(' recovery'));
  assert(decoder.decode(await home.read(source.node, source.handle, 0n, 30)) === 'new recovery', 'storage accepts writes after aborted transaction');
  const blocks = await home.create(admin, 'blocks', 2, context);
  assert((await home.getattr(blocks.node)).blockSize === BLOCK_SIZE, 'new files use small blocks');
  await home.write(blocks.node, blocks.handle, BigInt(BLOCK_SIZE * 3 - 3), encoder.encode('across'));
  const spanned = await home.read(blocks.node, blocks.handle, 0n, BLOCK_SIZE * 4);
  assert(spanned.length === BLOCK_SIZE * 3 + 3 && spanned.subarray(0, BLOCK_SIZE * 3 - 3).every(byte => byte === 0), 'holes before small blocks read as zero');
  assert(decoder.decode(spanned.subarray(BLOCK_SIZE * 3 - 3)) === 'across', 'write spans a small-block boundary');
  await home.write(blocks.node, blocks.handle, BigInt(BLOCK_SIZE), new Uint8Array(BLOCK_SIZE).fill(9));
  const whole = await home.read(blocks.node, blocks.handle, BigInt(BLOCK_SIZE - 1), BLOCK_SIZE + 2);
  assert(whole[0] === 0 && whole.subarray(1, BLOCK_SIZE + 1).every(byte => byte === 9) && whole[BLOCK_SIZE + 1] === 0, 'whole-block write replaces exactly one block');
  await home.release(blocks.node, blocks.handle);
  // A home written by the 64 KiB-only version (database version 1).
  await new Promise((resolve, reject) => {
    const open = indexedDB.open(legacyName, 1);
    open.onupgradeneeded = () => {
      const db = open.result, nodes = db.createObjectStore('nodes', { keyPath: 'id', autoIncrement: true });
      nodes.createIndex('entry', ['parent', 'name'], { unique: true }); nodes.createIndex('parent', 'parent');
      db.createObjectStore('chunks', { keyPath: ['inode', 'index'] }).createIndex('inode', 'inode');
      const now = { seconds: 0n, nanoseconds: 0 };
      nodes.put({ id: 1, parent: 0, name: '', mode: 0o040755, uid: 0, gid: 0, size: 0, atime: now, mtime: now, ctime: now });
      nodes.put({ id: 2, parent: 1, name: 'old', mode: 0o100600, uid: 1000, gid: 1000, size: CHUNK_SIZE + 5, atime: now, mtime: now, ctime: now });
      const first = new Uint8Array(CHUNK_SIZE); first.set(encoder.encode('legacy'), CHUNK_SIZE - 6);
      const second = new Uint8Array(CHUNK_SIZE); second.set(encoder.encode('chunk'));
      open.transaction.objectStore('chunks').put({ inode: 2, index: 0, data: first });
      open.transaction.objectStore('chunks').put({ inode: 2, index: 1, data: second });
    };
    open.onsuccess = () => { open.result.close(); resolve(); }; open.onerror = () => reject(open.error);
  });
  const legacy = await openPersistentHome({ name: legacyName });
  try {
    const old = await legacy.lookup(legacy.root, 'old');
    assert(decoder.decode(await legacy.read(old, {}, BigInt(CHUNK_SIZE - 6), 11)) === 'legacychunk', 'legacy 64 KiB chunks still read');
    await legacy.write(old, {}, BigInt(CHUNK_SIZE - 3), encoder.encode('ACY'));
    assert(decoder.decode(await legacy.read(old, {}, BigInt(CHUNK_SIZE - 6), 11)) === 'legACYchunk', 'legacy file keeps its chunk size on write');
    await legacy.setattr(old, { size: 0n });
    await legacy.write(old, {}, BigInt(BLOCK_SIZE - 1), encoder.encode('xy'));
    const fresh = await legacy.getattr(old);
    assert(Number(fresh.blockSize) === BLOCK_SIZE && fresh.size === BigInt(BLOCK_SIZE + 1), 'emptied legacy file moves to small blocks');
    assert(decoder.decode((await legacy.read(old, {}, 0n, BLOCK_SIZE + 1)).subarray(BLOCK_SIZE - 1)) === 'xy', 'emptied legacy file reads its new bytes');
  } finally { await legacy.destroy(); }
  try { (await idb(indexedDB.open(legacyName, 1))).close(); throw new Error('expected VersionError'); }
  catch (error) { assert(error.name === 'VersionError', 'an older page cannot open an upgraded home'); }
  const nested = await home.mkdir(admin, 'nested', context);
  try { await home.rename(home.root, 'admin', nested, 'cycle'); throw new Error('expected EINVAL'); } catch (error) { assert(error.errno === 22, 'directory cycles rejected'); }
  const release = await acquireHomeLock();
  try { await acquireHomeLock(); throw new Error('expected lock rejection'); } catch (error) { assert(error.message.includes('another tab'), 'concurrent guest lease rejected'); }
  finally { release(); }
  await home.destroy(); home = null;
  result.textContent = JSON.stringify({ status: 'passed', checks: passed }, null, 2);
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  result.textContent = JSON.stringify({ status: 'failed', checks: passed, error: error.stack }, null, 2);
  document.documentElement.dataset.result = 'fail';
} finally {
  await home?.destroy();
  indexedDB.deleteDatabase(dbName);
  indexedDB.deleteDatabase(legacyName);
}
</script>
