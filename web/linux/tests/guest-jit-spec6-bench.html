<!doctype html><meta charset="utf-8"><title>JIT 6 bench</title>
<style>body{font:16px sans-serif;margin:2em}pre{white-space:pre-wrap}</style>
<h1>Guest JIT 6: specializer coverage</h1>
<p>Auto-runs on load. Results go to the console (guest stdout) as PBLBENCH lines.</p>
<pre id="result">Settling</pre>
<script>
// JIT 6 fixture (docs/guest-jit-spec6-20261001.md), derived from the 3b
// fixture. One innermost-loop case per new specializer feature plus the
// int-loop and native-call (rejected) controls; batches of 100 reps timed with performance.now(), every rep
// checked against its expected value. Label from ?label= or the file name.
// Yields after every batch: a long synchronous run raises Firefox's modal
// slow-script dialog in this single-process build, which stalls the page.
const params=new URLSearchParams(location.search);
const label=params.get('label')||location.pathname.split('/').pop().replace(/\.html$/,'').replace(/^pblbench-/,'');
const REPS=100,WARMUPS=8,SAMPLES=11,ROUNDS=3,SETTLE_MS=15000;
function fib(n){return n<2?n:fib(n-1)+fib(n-2);}
function deep(n){if(n===0)throw 1;return deep(n-1);}
function f(n){if(n===0)throw 17;return f(n-1);}
function argsum(n,k){let s=0;for(let i=0;i<n;i++)s=(s+i*k)|0;return s;}
const cases=[
 ['int-loop',()=>{let sum=0;for(let i=0;i<10000;i++)sum=(sum+i)|0;return sum;},49995000],
 ['let-body',()=>{let s=0;for(let i=0;i<10000;i++){const t=(i*3)|0;let u=t;s=(s+u)|0;}return s;},149985000],
 ['args-loop',()=>argsum(10000,3),149985000],
 ['if-else',()=>{let s=0;for(let i=0;i<10000;i++){if(i&1)s=(s+i)|0;else s=(s-1)|0;}return s;},24995000],
 ['mod-continue',()=>{let s=0;for(let i=0;i<10000;i++){if(i%3===0)continue;s=(s+i)|0;}return s;},33326667],
 ['and-or',()=>{let s=0;for(let i=0;i<10000;i++){if(i>100&&i<9000||i===5)s=(s+1)|0;}return s;},8900],
 ['neg-bitnot',()=>{let s=0;for(let i=1;i<10000;i++)s=(s+(-i)+(~i&255))|0;return s;},-48718335],
 ['coalesce',()=>{let s=0,u=null;for(let i=0;i<10000;i++)s=(s+(u??2))|0;return s;},20000],
 ['native-call',()=>{let a=0;for(let i=0;i<4000;i++)a=Math.max(a,i);return a;},3999],
];
const out=document.getElementById('result');
function emit(obj){const line='PBLBENCH '+JSON.stringify(obj);console.log(line);out.textContent+='\n'+line;}
emit({event:'start',label,hc:navigator.hardwareConcurrency,ua:navigator.userAgent});
const tick=()=>new Promise(r=>setTimeout(r,0));
setTimeout(async()=>{
 const started=performance.now();let ok=true;
 try{
  for(let round=0;round<ROUNDS;round++){
   for(const [name,fn,expected] of cases){
    const caseStart=performance.now();
    for(let i=0;i<WARMUPS;i++){for(let r=0;r<REPS;r++){const v=fn();if(v!==expected)throw new Error(name+' warmup '+v);}await tick();}
    const samples=[];let checksum=0;
    for(let s=0;s<SAMPLES;s++){
     const begin=performance.now();
     for(let r=0;r<REPS;r++){const v=fn();if(v!==expected)throw new Error(name+' value '+v);checksum=(checksum+v)|0;}
     samples.push(performance.now()-begin);await tick();
    }
    const sorted=samples.slice().sort((a,b)=>a-b);
    emit({event:'case',label,round,name,caseMs:+(performance.now()-caseStart).toFixed(1),checksum,reps:REPS,batchMs:samples.map(x=>+x.toFixed(3)),medianBatchMs:+sorted[SAMPLES>>1].toFixed(3)});
   }
  }
 }catch(e){ok=false;emit({event:'error',label,error:String(e)});}
 emit({event:'done',label,ok,elapsedMs:+(performance.now()-started).toFixed(1)});
},SETTLE_MS);
</script>
