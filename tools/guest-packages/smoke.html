<!doctype html><meta charset="utf-8"><title>Isolated Wasm Linux package check</title><canvas id="display" width="640" height="480"></canvas><pre id="log"></pre><script type="module">
import {spawnMachine,consoleDevice,entropyDevice,inputDevice} from '/linux/dist/index.js';
const result=window.packageResult={done:false,pass:false,lines:[],errors:[],isolated:crossOriginIsolated,startedAt:new Date().toISOString()};let machine;const decoder=new TextDecoder();let pending='';
function text(bytes){pending+=decoder.decode(new Uint8Array(bytes),{stream:true});const lines=pending.split('\n');pending=lines.pop();for(const raw of lines){const line=raw.replaceAll('\r','');result.lines.push(line);if(result.lines.length>2000)result.lines.shift();const exit=/^PACKAGE_SMOKE_EXIT status=(\d+)/.exec(line);if(exit){result.exitCode=Number(exit[1]);result.pass=result.exitCode===0;result.done=true;}}document.querySelector('#log').textContent=result.lines.slice(-100).join('\n');}
window.startPackageSmoke=async config=>{try{if(!crossOriginIsolated)throw Error('isolation missing');if(navigator.hardwareConcurrency!==config.cpus)throw Error('CPU equality failed');const image=new Uint8Array(await(await fetch('/image.cpio')).arrayBuffer());const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',image)),x=>x.toString(16).padStart(2,'0')).join('');if(hash!==config.sha256)throw Error('image hash mismatch');result.configuration={cpus:config.cpus,memoryBytes:536870912,hardwareConcurrency:navigator.hardwareConcurrency,imageSha256:hash};machine=await spawnMachine({cpus:config.cpus,devicetree:{memory:{reg:[0,536870912]}},initcpio:image,cmdline:'console=hvc0 rdinit=/init',devices:[consoleDevice(null,new WritableStream({write:text})),entropyDevice(),inputDevice()],framebuffer:{canvas:document.querySelector('#display'),width:640,height:480,backend:'canvas2d'}});window.packageMachine=machine;void(async()=>{const reader=machine.bootConsole.getReader();const d=new TextDecoder();try{while(true){const x=await reader.read();if(x.done)break;result.bootLog=((result.bootLog||'')+d.decode(new Uint8Array(x.value),{stream:true})).slice(-32000);}}finally{reader.releaseLock();}})();machine.closed.catch(e=>{if(!result.done){result.errors.push(String(e));result.done=true;}});}catch(e){result.errors.push(String(e));result.done=true;}};
</script>
