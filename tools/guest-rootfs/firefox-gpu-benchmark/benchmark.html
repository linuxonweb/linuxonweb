<!doctype html>
<meta charset="utf-8"><title>Guest Firefox GPU benchmark</title>
<style>body{font:16px system-ui;background:#10201d;color:#d7efe8;margin:24px}canvas{width:256px;height:256px;image-rendering:pixelated}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Guest Firefox GPU benchmark</h1>
<p>Fixed offscreen workload; every timed frame waits for completed GPU work. Unsupported APIs remain visible.</p>
<canvas id="preview" width="128" height="128"></canvas><pre id="result">Running…</pre>
<script>
'use strict';
const workload={id:'fullscreen-recurrence-v1',width:128,height:128,iterations:256,warmup:5,framesPerRound:20,rounds:3,present:false};
const identity={userAgent:navigator.userAgent,reportedBuildID:navigator.buildID??null,hardwareConcurrency:navigator.hardwareConcurrency};
const result=window.gpuBenchmark={identity,workload,webgl:null,webgpu:null,done:false};
const median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)];
const hash=a=>{let h=2166136261;for(const x of a){h^=x;h=Math.imul(h,16777619);}return(h>>>0).toString(16).padStart(8,'0');};
function pixels(bytes){const center=Array.from(bytes.slice((64*128+64)*4,(64*128+64)*4+4));return{fnv1a32:hash(bytes),center,correct:center[0]>=30&&center[1]>=30&&center[2]===64&&center[3]===255};}
async function timing(draw){for(let i=0;i<workload.warmup;i++)await draw();const rounds=[];for(let r=0;r<workload.rounds;r++){const start=performance.now();for(let i=0;i<workload.framesPerRound;i++)await draw();const milliseconds=performance.now()-start;rounds.push({frames:workload.framesPerRound,milliseconds,frameMs:milliseconds/workload.framesPerRound,fps:1000*workload.framesPerRound/milliseconds});}return{rounds,medianFrameMs:median(rounds.map(x=>x.frameMs)),medianFps:median(rounds.map(x=>x.fps)),completedFrames:workload.warmup+workload.rounds*workload.framesPerRound};}
function shaderSource(language){return language==='glsl'?`precision highp float;varying vec2 uv;void main(){vec2 v=uv*0.5+0.25;for(int i=0;i<256;i++){v=fract(v*vec2(1.001,1.003)+vec2(0.0001,0.0002));}gl_FragColor=vec4(v*0.5+0.25,0.25,1.0);}`:`@fragment fn fs(@location(0) uv:vec2<f32>)->@location(0) vec4<f32>{var v=uv*0.5+vec2<f32>(0.25);for(var i=0;i<256;i++){v=fract(v*vec2<f32>(1.001,1.003)+vec2<f32>(0.0001,0.0002));}return vec4<f32>(v*0.5+vec2<f32>(0.25),0.25,1.0);}`;}
async function webgl(){const canvas=document.getElementById('preview'),creationErrors=[];canvas.addEventListener('webglcontextcreationerror',e=>creationErrors.push(e.statusMessage));const gl=canvas.getContext('webgl',{antialias:false,depth:false,stencil:false,preserveDrawingBuffer:true});if(!gl)return{status:'unavailable',creationErrors,completedFrames:0};const debug=gl.getExtension('WEBGL_debug_renderer_info');const renderer={version:gl.getParameter(gl.VERSION),vendor:gl.getParameter(gl.VENDOR),renderer:gl.getParameter(gl.RENDERER),unmaskedVendor:debug?gl.getParameter(debug.UNMASKED_VENDOR_WEBGL):null,unmaskedRenderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):null};let program,buffer,texture,framebuffer;try{function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}program=gl.createProgram();const vs=shader(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}'),fs=shader(gl.FRAGMENT_SHADER,shaderSource('glsl'));gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,128,128,0,gl.RGBA,gl.UNSIGNED_BYTE,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);framebuffer=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,framebuffer);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('incomplete framebuffer');gl.viewport(0,0,128,128);const draw=()=>{gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();if(gl.isContextLost()||gl.getError()!==gl.NO_ERROR)throw Error('GL rendering error');};const measured=await timing(draw),bytes=new Uint8Array(128*128*4);gl.readPixels(0,0,128,128,gl.RGBA,gl.UNSIGNED_BYTE,bytes);if(gl.getError()!==gl.NO_ERROR)throw Error('readPixels failed');const verification=pixels(bytes);return{status:verification.correct?'ok':'incorrect-pixels',api:'webgl',renderer,completion:'gl.finish per frame',...measured,pixels:verification};}catch(error){return{status:'failed',renderer,error:String(error.message||error),stack:error.stack??null};}finally{if(framebuffer)gl.deleteFramebuffer(framebuffer);if(texture)gl.deleteTexture(texture);if(buffer)gl.deleteBuffer(buffer);if(program)gl.deleteProgram(program);}}
async function webgpu(){if(!navigator.gpu)return{status:'unavailable',reason:'navigator.gpu absent',completedFrames:0};let device,texture,staging;try{const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)return{status:'unavailable',reason:'requestAdapter returned null',completedFrames:0};const info=adapter.info??await adapter.requestAdapterInfo?.();const renderer=info?{vendor:info.vendor,architecture:info.architecture,device:info.device,description:info.description,isFallbackAdapter:adapter.isFallbackAdapter}:{};device=await adapter.requestDevice();const errors=[];device.addEventListener('uncapturederror',e=>errors.push(e.error.message));let lost=null;device.lost.then(x=>lost=x);const module=device.createShaderModule({code:`struct O{@builtin(position) p:vec4<f32>,@location(0) uv:vec2<f32>};@vertex fn vs(@builtin(vertex_index) i:u32)->O{let a=array<vec2<f32>,3>(vec2<f32>(-1,-1),vec2<f32>(3,-1),vec2<f32>(-1,3));var o:O;o.p=vec4<f32>(a[i],0,1);o.uv=a[i]*0.5+vec2<f32>(0.5);return o;}`+shaderSource('wgsl')});const pipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format:'rgba8unorm'}]},primitive:{topology:'triangle-list'}});texture=device.createTexture({size:[128,128],format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});const view=texture.createView();const draw=async()=>{const e=device.createCommandEncoder(),p=e.beginRenderPass({colorAttachments:[{view,loadOp:'clear',storeOp:'store',clearValue:[0,0,0,1]}]});p.setPipeline(pipeline);p.draw(3);p.end();device.queue.submit([e.finish()]);await device.queue.onSubmittedWorkDone();if(lost||errors.length)throw Error('WebGPU lost/error: '+JSON.stringify({lost,errors}));};const measured=await timing(draw);staging=device.createBuffer({size:128*128*4,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});const e=device.createCommandEncoder();e.copyTextureToBuffer({texture},{buffer:staging,bytesPerRow:512},[128,128]);device.queue.submit([e.finish()]);await staging.mapAsync(GPUMapMode.READ);const bytes=new Uint8Array(staging.getMappedRange()).slice();staging.unmap();const verification=pixels(bytes);return{status:verification.correct?'ok':'incorrect-pixels',api:'webgpu',renderer,completion:'queue.onSubmittedWorkDone per frame',...measured,pixels:verification};}catch(error){return{status:'failed',error:String(error.message||error),stack:error.stack??null};}finally{staging?.destroy();texture?.destroy();device?.destroy();}}
(async()=>{console.log('GPU_BENCH_START '+JSON.stringify({identity,workload}));result.webgl=await webgl();console.log('GPU_BENCH_API '+JSON.stringify({api:'webgl',...result.webgl}));result.webgpu=await webgpu();result.done=true;document.title='GPU_BENCH_DONE';document.getElementById('result').textContent=JSON.stringify(result,null,2);console.log('GPU_BENCH_RESULT '+JSON.stringify(result));})().catch(error=>{result.error=String(error.stack||error);result.done=true;console.log('GPU_BENCH_RESULT '+JSON.stringify(result));});
</script>
