<!doctype html>
<meta charset="utf-8">
<title>Firefox native graphics diagnostic</title>
<style>body{font:16px system-ui;background:#18212b;color:#eee;margin:24px}canvas{width:256px;height:256px;image-rendering:pixelated}pre{white-space:pre-wrap}</style>
<h1>Firefox native graphics diagnostic</h1>
<p>This isolated test checks a small WebGL render and readback. Full Firefox GPU acceptance remains pending.</p>
<canvas width="64" height="64"></canvas><pre id="result">Running…</pre>
<script>
(() => {
  const nonce=new URL(location.href).searchParams.get('nonce');
  const report = {schema:1,kind:'firefox-native-webgl-primitive',nonce,pass:false,
    browser:{userAgent:navigator.userAgent,hardwareConcurrency:navigator.hardwareConcurrency},
    contextErrors:[],stages:[],width:64,height:64,firefoxGpuAcceptance:false};
  const canvas=document.querySelector('canvas');
  canvas.addEventListener('webglcontextcreationerror',e=>report.contextErrors.push(String(e.statusMessage||'context creation failed')));
  let gl,program,buffer;
  try {
    if(!/^[a-f0-9]{32}$/.test(nonce||''))throw Error('owned diagnostic nonce required');
    gl=canvas.getContext('webgl',{alpha:false,depth:false,stencil:false,antialias:false,
      preserveDrawingBuffer:true,failIfMajorPerformanceCaveat:false});
    report.contextCreated=Boolean(gl);
    if(!gl)throw Error('WebGL context unavailable');
    report.contextAttributes=gl.getContextAttributes();
    report.identity={vendor:gl.getParameter(gl.VENDOR),renderer:gl.getParameter(gl.RENDERER),
      version:gl.getParameter(gl.VERSION),shadingLanguage:gl.getParameter(gl.SHADING_LANGUAGE_VERSION)};
    const debug=gl.getExtension('WEBGL_debug_renderer_info');
    if(debug)Object.assign(report.identity,{unmaskedVendor:gl.getParameter(debug.UNMASKED_VENDOR_WEBGL),unmaskedRenderer:gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)});
    const shader=(kind,source)=>{const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const message=gl.getShaderInfoLog(s);gl.deleteShader(s);throw Error('shader compile: '+message);}return s;};
    const vs=shader(gl.VERTEX_SHADER,'attribute vec2 p; void main(){gl_Position=vec4(p,0.0,1.0);}');
    const fs=shader(gl.FRAGMENT_SHADER,'precision mediump float; void main(){gl_FragColor=vec4(1.0,0.0,0.0,1.0);}');
    program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
    gl.deleteShader(vs);gl.deleteShader(fs);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('program link: '+gl.getProgramInfoLog(program));
    gl.useProgram(program);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-0.75,-0.75,0.75,-0.75,0,0.75]),gl.STATIC_DRAW);
    const location=gl.getAttribLocation(program,'p');if(location<0)throw Error('missing vertex attribute');
    gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,2,gl.FLOAT,false,0,0);
    gl.viewport(0,0,64,64);gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);gl.disable(gl.STENCIL_TEST);
    gl.clearColor(0,0,1,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
    const pixels=new Uint8Array(64*64*4);gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    let checks=0,failures=0,redPixels=0,bluePixels=0,unexpectedPixels=0,checksum=2166136261;
    for(let y=0;y<64;y++)for(let x=0;x<64;x++){
      const offset=(y*64+x)*4,rgba=Array.from(pixels.subarray(offset,offset+4));
      const red=rgba.every((v,i)=>Math.abs(v-[255,0,0,255][i])<=2),blue=rgba.every((v,i)=>Math.abs(v-[0,0,255,255][i])<=2);
      if(red)redPixels++;else if(blue)bluePixels++;else unexpectedPixels++;
      // Check points safely inside/outside the triangle; avoid raster edges.
      const px=(x+0.5)/32-1,py=(y+0.5)/32-1;
      const interior=py>-.70&&py<.70&&Math.abs(px)<(.75-py)/2-.035;
      const exterior=py<-.80||py>.80||Math.abs(px)>(.75-py)/2+.035;
      if(interior||exterior){checks+=4;const expected=interior?[255,0,0,255]:[0,0,255,255];
        for(let c=0;c<4;c++)if(Math.abs(rgba[c]-expected[c])>2)failures++;}
      for(const value of rgba)checksum=Math.imul((checksum^value)>>>0,16777619)>>>0;
    }
    report.pixels={checks,failures,redPixels,bluePixels,unexpectedPixels,checksum};
    report.glError=gl.getError();report.contextLost=gl.isContextLost();
    report.pass=checks>12000&&failures===0&&redPixels>500&&bluePixels>2500&&unexpectedPixels===0&&report.glError===gl.NO_ERROR&&!report.contextLost;
  }catch(error){report.error=String(error.stack||error);}
  finally {
    if(gl){if(buffer)gl.deleteBuffer(buffer);if(program)gl.deleteProgram(program);}
    report.stages.push('terminal');window.firefoxNativeGpuProbe=report;
    document.querySelector('#result').textContent=JSON.stringify(report,null,2);
    document.documentElement.dataset.result=report.pass?'pass':'fail';
    const line='FIREFOX_GPU_NATIVE_V1 '+JSON.stringify(report);
    console.log(line);
    if(typeof window.dump==='function')window.dump(line+'\n');
  }
})();
</script>
