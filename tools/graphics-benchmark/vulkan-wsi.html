<h1>Public Vulkan acquire / render / present</h1><div class="stage"><canvas id="display" width="640" height="480"></canvas></div><pre id="out">RUNNING</pre>
<script type="module">
import {spawnMachine,consoleDevice,entropyDevice,inputDevice} from '/linux/dist/index.js';
import {createPresentOverlay} from '/linux/gpu-present-overlay.mjs';
import {guestGpuHostcallOptions} from '/linux/guest-gpu-config.mjs';
const backend=new URLSearchParams(location.search).get('backend')||'webgpu';if(!['webgpu','webgl'].includes(backend))throw Error('explicit backend required');
const report=window.graphicsResults={kind:'current public guest Vulkan WSI smoke',done:false,pass:false,backend,logs:'',bootLogs:'',ownerEvents:[],errors:[],presents:0,presentKinds:{},isolated:crossOriginIsolated};
const canvas=document.getElementById('display'),overlay=createPresentOverlay({canvas}),start=performance.now(),decoder=new TextDecoder();let machine,timer,partial='';
function finish(){if(report.done)return;report.done=true;clearTimeout(timer);report.durationMs=performance.now()-start;report.overlay={...overlay.counters};report.pass=report.errors.length===0&&report.exitStatus===0&&/VKGEARS_READY .*wsi=1/.test(report.logs)&&/VKGEARS_SWAPCHAIN images=/.test(report.logs)&&/VKGEARS_DONE .*status=0/.test(report.logs)&&/GUEST_VK_CLOSE status=0/.test(report.logs)&&/GUEST_VK_RESOURCES live=0 allocated_bytes=0/.test(report.logs)&&/GUEST_VK_WSI_LIVE swapchains=0 leaked=0/.test(report.logs)&&/GUEST_VK_WSI_SURFACES live=0 leaked=0/.test(report.logs)&&report.presents>1&&(report.overlay.shown>0||report.overlay.attached>0);document.getElementById('out').textContent=(report.pass?'ALL PASSED':'FAILED')+'\n'+report.logs;machine?.close();}
function log(bytes){const text=decoder.decode(new Uint8Array(bytes),{stream:true});report.logs=(report.logs+text).slice(-262144);const lines=(partial+text).split('\n');partial=lines.pop().slice(-8192);for(const line of lines){const m=/VULKAN_WSI_SMOKE_EXIT status=(\d+)/.exec(line);if(m){report.exitStatus=Number(m[1]);finish();}}document.getElementById('out').textContent=report.logs.slice(-12000);}
try{
 if(!crossOriginIsolated)throw Error('cross-origin isolation required');

 report.configuration={cpus:navigator.hardwareConcurrency,memoryBytes:1073741824,framebuffer:[640,480],backend,guestPersistentHome:false};
 timer=setTimeout(()=>{report.errors.push('bounded70s WSI deadline');finish();},70000);

 void(async()=>{const reader=machine.bootConsole.getReader(),d=new TextDecoder();try{for(;;){const{value,done}=await reader.read();if(done)break;report.bootLogs=(report.bootLogs+d.decode(new Uint8Array(value),{stream:true})).slice(-32768);}}catch(e){report.bootError=String(e);}finally{reader.releaseLock();}})();
 machine.closed.catch(error=>{if(!report.done){report.errors.push(String(error));finish();}});
}catch(error){report.errors.push(String(error));finish();}
</script>
